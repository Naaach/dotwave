<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dotwave — animated dotted background</title>
    <style>
      :root {
        --ink: #e8ecf4;
        --muted: #8b93a7;
        --line: rgba(255, 255, 255, 0.1);
        --panel: rgba(16, 18, 24, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: #121316;
        color: var(--ink);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      /* The library appends its canvas here, so this only has to be a box. */
      #stage {
        position: fixed;
        inset: 0;
      }

      .hero {
        position: relative;
        z-index: 1;
        display: grid;
        place-content: center;
        height: 100%;
        padding: 24px;
        text-align: center;
        pointer-events: none;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(38px, 8vw, 86px);
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .hero p {
        max-width: 46ch;
        margin: 0 auto;
        color: var(--muted);
      }

      .hero code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.9em;
        color: #6ee7b7;
      }

      .panel {
        position: fixed;
        z-index: 2;
        top: 16px;
        right: 16px;
        width: 288px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        font-size: 12px;
      }

      .panel h2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .panel h2 span {
        color: #6ee7b7;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        text-transform: none;
      }

      label {
        display: block;
        margin-bottom: 10px;
      }

      label > span {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #6ee7b7;
      }

      select,
      input[type="color"] {
        width: 100%;
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #14161c;
        color: var(--ink);
        font: inherit;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      .row > * {
        flex: 1;
      }

      button {
        width: 100%;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #14161c;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: #6ee7b7;
        color: #6ee7b7;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
      }

      .check input {
        accent-color: #6ee7b7;
      }

      hr {
        margin: 12px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>

  <body>
    <!-- Everything inside #stage stays clickable: the canvas ignores pointer events. -->
    <div id="stage"></div>

    <div class="hero">
      <div>
        <h1>dotwave</h1>
        <p>
          A grid of dots driven by 3D Simplex noise.
          <code>createDotWave({ preset: "aurora", angle: 30 })</code>
        </p>
      </div>
    </div>

    <aside class="panel">
      <h2>Controls <span id="fps">– fps</span></h2>

      <label>
        <span>Preset</span>
        <select id="preset">
          <!-- Populated from presetNames, so it can never drift from the library. -->
          <option value="custom">custom</option>
        </select>
      </label>

      <label>
        <span>Shape</span>
        <select id="shape">
          <option value="dot">dot</option>
          <option value="ring">ring</option>
          <option value="square">square</option>
        </select>
      </label>

      <div class="row">
        <label>
          <span>Dot colour</span>
          <input type="color" id="dotColor" />
        </label>
        <label>
          <span>Background</span>
          <input type="color" id="backgroundColor" />
        </label>
      </div>

      <label><span>Angle <b id="angleValue">0°</b></span><input type="range" id="angle" min="0" max="90" step="1" /></label>
      <label><span>Spacing <b id="spacingValue"></b></span><input type="range" id="spacing" min="8" max="80" step="1" /></label>
      <label><span>Dot radius <b id="dotRadiusValue"></b></span><input type="range" id="dotRadius" min="0.4" max="6" step="0.1" /></label>
      <label><span>Glow <b id="glowBlurValue"></b></span><input type="range" id="glowBlur" min="0" max="40" step="1" /></label>
      <label><span>Noise scale <b id="noiseScaleValue"></b></span><input type="range" id="noiseScale" min="0.0005" max="0.01" step="0.0005" /></label>
      <label><span>Speed <b id="speedValue"></b></span><input type="range" id="speed" min="0" max="0.005" step="0.0001" /></label>
      <label><span>Gamma <b id="gammaValue"></b></span><input type="range" id="gamma" min="0.5" max="6" step="0.1" /></label>
      <label><span>Intensity <b id="intensityValue"></b></span><input type="range" id="intensity" min="0.1" max="1" step="0.05" /></label>
      <label><span>Size variation <b id="sizeVariationValue"></b></span><input type="range" id="sizeVariation" min="0" max="1" step="0.05" /></label>

      <label class="check"><input type="checkbox" id="interactive" /> React to the pointer</label>

      <hr />

      <div class="row">
        <button id="toggle">Pause</button>
        <button id="rebuild">Rebuild</button>
      </div>
    </aside>

    <!-- The global build: window.DotWave.createDotWave(...) -->
    <script src="../dist/index.global.js"></script>
    <script>
      const { createDotWave, presets, presetNames } = DotWave;

      const $ = (id) => document.getElementById(id);
      const sliders = [
        "angle",
        "spacing",
        "dotRadius",
        "glowBlur",
        "noiseScale",
        "speed",
        "gamma",
        "intensity",
        "sizeVariation",
      ];

      /** Accepts "255, 255, 255", "#fff" or "rgb(...)" and returns "#rrggbb". */
      function toHex(value) {
        const numbers = String(value).match(/\d+/g) ?? ["255", "255", "255"];
        return (
          "#" +
          numbers
            .slice(0, 3)
            .map((part) => Number(part).toString(16).padStart(2, "0"))
            .join("")
        );
      }

      function rgbToString(value) {
        const numbers = (value.match(/\d+/g) ?? ["255", "255", "255"]).slice(0, 3).map(Number);
        return `rgb(${numbers.join(", ")})`;
      }

      let wave = createDotWave({ container: "#stage", preset: "aurora", interactive: true });

      // Reads a preset (or the live options) into the controls.
      function sync(options, presetName) {
        for (const id of sliders) $(id).value = options[id] ?? 0;
        $("shape").value = options.shape ?? "dot";
        $("interactive").checked = Boolean(options.interactive);
        if (options.dotColor) $("dotColor").value = toHex(options.dotColor);
        if (options.backgroundColor) $("backgroundColor").value = toHex(options.backgroundColor);
        $("preset").value = presetName ?? "custom";
        paint();
      }

      function paint() {
        for (const id of sliders) {
          const value = Number($(id).value);
          $(id + "Value").textContent =
            id === "angle"
              ? `${value}°`
              : id === "speed" || id === "noiseScale"
                ? value.toFixed(4)
                : value;
        }
      }

      function collect() {
        const next = {
          shape: $("shape").value,
          interactive: $("interactive").checked,
          dotColor: rgbToString($("dotColor").value),
          backgroundColor: rgbToString($("backgroundColor").value),
        };
        for (const id of sliders) next[id] = Number($(id).value);
        return next;
      }

      /** Any manual change drops back to "custom" and is applied on the spot. */
      function applyCustom() {
        $("preset").value = "custom";
        wave.updateOptions(collect());
      }

      for (const id of sliders) {
        $(id).addEventListener("input", () => {
          paint();
          applyCustom();
        });
      }

      $("shape").addEventListener("change", applyCustom);
      $("interactive").addEventListener("change", applyCustom);
      $("dotColor").addEventListener("input", applyCustom);
      $("backgroundColor").addEventListener("input", applyCustom);

      for (const name of presetNames) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        $("preset").append(option);
      }

      $("preset").addEventListener("change", (event) => {
        const name = event.target.value;
        if (!name) return;
        wave.updateOptions({ preset: name });
        sync(presets[name], name);
      });

      $("toggle").addEventListener("click", () => {
        if (wave.running) {
          wave.pause();
          $("toggle").textContent = "Play";
        } else {
          wave.play();
          $("toggle").textContent = "Pause";
        }
      });

      // Proves the point of destroy(): no listeners, no rAF, no canvas left behind.
      $("rebuild").addEventListener("click", () => {
        wave.destroy();
        wave = createDotWave({ container: "#stage", ...collect() });
      });

      let frames = 0;
      let last = performance.now();
      (function tick(now) {
        frames += 1;
        if (now - last >= 500) {
          $("fps").textContent = `${Math.round((frames * 1000) / (now - last))} fps`;
          frames = 0;
          last = now;
        }
        requestAnimationFrame(tick);
      })(last);

      sync(presets.aurora, "aurora");
    </script>
  </body>
</html>
